/* Screen-fitted vertical presentation: one viewport per section, with natural scrolling */
:root{--presentation-nav:68px}
html{scroll-behavior:smooth;scroll-snap-type:y proximity;scroll-padding-top:var(--presentation-nav)}
.sitebar{min-height:var(--presentation-nav)}
.web-cover{min-height:calc(100dvh - var(--presentation-nav));scroll-snap-align:start;scroll-margin-top:var(--presentation-nav)}
.part{padding:0 24px!important;background:linear-gradient(180deg,var(--tone),#fff 78%)!important;border:0}
.part-inner{max-width:none!important}
.presentation-page{height:calc(100dvh - var(--presentation-nav));min-height:520px;scroll-snap-align:start;scroll-margin-top:var(--presentation-nav);overflow-y:auto;overscroll-behavior-y:contain;display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,4vh,58px) max(18px,calc((100vw - 1160px)/2));border-bottom:1px solid var(--lineTone);scrollbar-width:thin;scrollbar-color:var(--lineTone) transparent}
.presentation-page > *{flex-shrink:0;max-width:1160px;width:100%;margin-left:auto!important;margin-right:auto!important}
.presentation-page > .slide,.presentation-page > .review-block,.presentation-page > .research-panel,.presentation-page > .section-break-chi,.presentation-page > .part-heading{padding-top:18px!important;padding-bottom:18px!important}
.presentation-page > .slide{margin-bottom:0!important}
.presentation-page:has(.section-break-chi){background:linear-gradient(120deg,var(--tone) 0%,#fff 90%)}
.presentation-page > .section-break-chi{min-height:0!important;margin-top:0!important;margin-bottom:0!important}
.presentation-page:has(.part-heading){background:linear-gradient(135deg,var(--tone),#fff 80%)}
.presentation-page .review-block{margin-bottom:0!important}
.presentation-controls{position:fixed;right:22px;bottom:68px;z-index:60;display:flex;align-items:center;gap:6px;padding:6px;background:#fffefaee;backdrop-filter:blur(10px);border:1px solid #e5e2e8;border-radius:99px;box-shadow:0 9px 28px #00000010}
.presentation-controls button{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:#343039;font-size:22px;line-height:1}
.presentation-controls button:hover:not(:disabled){background:#f1eaf3}
.presentation-controls button:disabled{opacity:.25;cursor:default}
.presentation-controls .presentation-label{color:#68616e;font-size:12px;font-variant-numeric:tabular-nums;padding:0 8px;white-space:nowrap}
@media(max-width:800px){:root{--presentation-nav:99px}.part{padding:0 12px!important}.presentation-page{height:calc(100dvh - var(--presentation-nav));min-height:440px;padding:24px 14px;justify-content:flex-start}.web-cover{min-height:calc(100dvh - var(--presentation-nav))}.presentation-controls{right:12px;bottom:55px}.presentation-page .review-cols,.presentation-page .grid{grid-template-columns:1fr}.presentation-page .table{font-size:12px}}
@media print{html{scroll-snap-type:none}.presentation-controls{display:none!important}.presentation-page{height:auto!important;min-height:95vh;overflow:visible;break-after:page}.part{padding:0!important}}

.cover-tag{background:var(--chi-pale)!important;color:var(--chi-dark)!important}.cover-tag.alt{background:var(--cscw-pale)!important;color:var(--cscw-dark)!important}
.cover-amp{color:var(--chi)!important}.cover-orb.one{background:radial-gradient(circle at 35% 35%,#e4c7f4 0%,#c4a4dd 43%,#f2e8f9 72%,transparent 73%)}.cover-orb.two{background:radial-gradient(circle at 45% 45%,#cee9d5 0%,#95c5a7 43%,#ecf8ef 72%,transparent 73%)}
.cover-block.pink{border-color:var(--chi-line);background:var(--chi-pale)}.cover-block.green{border-color:var(--cscw-line);background:var(--cscw-pale)}

<body><header class="sitebar"><strong>CHI &amp; CSCW · 会议论文写作与投稿路径</strong><nav id="main-nav"></nav></header><main id="deck"></main><div class="presentation-controls" id="presentation-controls" aria-label="页面导航"><button type="button" id="previous-page" title="上一页（↑）" aria-label="上一页">↑</button><span class="presentation-label" id="presentation-label">01 / 01</span><button type="button" id="next-page" title="下一页（↓）" aria-label="下一页">↓</button></div><div class="page-indicator" id="page-indicator" aria-label="当前位置页码">01</div><footer class="site-footer">CHI / CSCW 学术写作资料 · 规则请以当年官方 Call for Papers 为准</footer>
<script>
const SRC={papers:'https://chi2027.acm.org/authors/papers/',review:'https://chi2027.acm.org/authors/papers/papers-review-process/',policy:'https://chi2027.acm.org/2026/08/24/submitting-a-chi-2027-paper-means-sharing-responsibility-for-peer-review/',process:'https://chi2027.acm.org/2026/08/17/how-the-chi-2027-papers-review-process-will-work/',poster:'https://chi2027.acm.org/authors/posters/',template:'https://www.acm.org/publications/proceedings-template',video:'https://chi2027.acm.org/guide-to-a-successful-video-submission/',awards:'https://programs.sigchi.org/chi/2025/awards/best-papers'};
const src=(key,label='官方来源')=>`<a target="_blank" rel="noopener" href="${SRC[key]}">${label} ↗</a>`;
const foot=(source='papers',note='CHI / CSCW · 论文写作与投稿')=>`<div class="bottom"><span>${note}</span><span>${src(source)}</span></div>`;
const slides=[
{title:'封面',note:'开场互动：你觉得 CHI 是什么会议？强调这是人机交互学术会议，不是仅讨论 AI 的会议。',html:`<p class="eyebrow">HCI / CSCW · ACADEMIC WRITING</p><h1>CHI & CSCW<br><span class="accent">会议论文写作</span><br>与投稿路径</h1><p class="subtitle">两条投稿路径 · 两篇真实论文 · 从评审反馈到再投稿</p><div class="pillrow"><span class="chip">CHI / CSCW</span><span class="chip">Paper · Review · Revision</span></div><div class="outline"></div>${foot()}`},
{title:'课程路线',note:'建议全套90–120分钟，章节可以自由跳转。',html:`<p class="eyebrow">01 / ROADMAP</p><h2>论文写作与投稿的 <span class="accent">7 个环节</span></h2><div class="grid three">${[['01','CHI 是什么','定位、录取率、奖项'],['02','研究什么','研究主题、贡献类型'],['03','怎么写论文','框架、证据链、文献'],['04','怎么投稿','格式、Overleaf、审稿义务'],['05','怎么评审','R1–R3、AC、评分、修改'],['06','录取后做什么','视频、Poster、出席'],['07','花多少钱','APC、注册、差旅']].map(x=>`<div class="card"><span class="kicker">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div>${foot()}`},
{title:'什么是 CHI',note:'强调跨学科；既可以做实验也可以做设计/访谈/理论。',html:`<p class="eyebrow">UNDERSTAND CHI</p><h2>CHI 研究的不是一个应用，<br>而是<span class="accent">人与计算技术的关系</span>。</h2><div class="grid three"><div class="card soft"><h3>Human</h3><p>用户、群体、社会、文化、组织与实践</p></div><div class="card soft"><h3>Computer</h3><p>AI、移动设备、可穿戴、系统与交互媒介</p></div><div class="card soft"><h3>Interaction</h3><p>使用、理解、协作、决策、体验和设计</p></div></div><div class="note">CHI 属于 ACM SIGCHI 旗舰会议。论文的核心是清楚说明对 HCI 领域的学术贡献。</div>${foot('papers')}`},
{title:'录取率',note:'统计是2026历史值，不是2027预测。切忌把“25%”解释成任何稿件都有25%的几率。',html:`<p class="eyebrow">ACCEPTANCE</p><h2>录取率大约 <span class="accent">1 / 4</span></h2><div class="grid three"><div class="card"><div class="number">6,730</div><p>CHI 2026 完整论文投稿</p></div><div class="card"><div class="number">1,705</div><p>条件录取论文</p></div><div class="card dark"><div class="number" style="color:#bfe6d0">25.3%</div><p>2026 总体录取率</p></div></div><div class="note">录取率随年份、Subcommittee、论文类型和评审变化。不能从总体录取率推算一篇具体论文的概率。</div>${foot('process','数据：CHI 2026 公开会议统计；CHI 2027 规则另行适用')}`},
{title:'选题地图',note:'让学生想到身边的一个技术实践现象。',html:`<p class="eyebrow">TOPICS & DIRECTIONS</p><h2>哪些研究方向可以投 CHI？</h2><div class="grid three">${[['人机与 AI 协作','AI Agent、信任、监督、共同创作'],['健康与数字照护','患者 AI、远程医疗、健康信息'],['教育与学习','AI Tutor、课堂协作、教育公平'],['无障碍与包容设计','辅助技术、残障群体、适老设计'],['交互设计','XR、可穿戴、具身与空间交互'],['社会技术与文化','劳动、平台、伦理、社区实践']].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div>${foot('papers')}`},
{title:'从现象到研究问题',note:'可请同学选一个日常现象，口头改写为研究问题。',html:`<p class="eyebrow">FIND A QUESTION</p><h2>好奇的现象 <span class="accent">→</span> 可研究的问题</h2><table class="table"><thead><tr><th>身边现象</th><th>可能的 HCI 研究问题</th></tr></thead><tbody>${[['学生经常用 ChatGPT 写作业','学生何时接受、质疑或修改 AI 建议？'],['患者把 AI 的答案带去医院','AI 生成信息如何进入医患沟通？'],['设计师用 AI 生成方案','人机协作怎样影响创意控制与返工？'],['老年人使用智能手表','什么影响持续使用、信任和依赖？'],['游客使用 AR 导览','数字叠加怎样改变空间体验？']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table><div class="note">课堂讨论：一个“有趣现象”，还需要怎样的证据和文献才能形成学术研究？</div>${foot('papers','以上研究问题为教学示例')}`},
{title:'贡献类型',note:'不要把“我做了一个APP”当论文贡献，问这个研究教会我们什么。',html:`<p class="eyebrow">HCI CONTRIBUTIONS</p><h2>CHI 看重的是 <span class="accent">Contribution</span></h2><div class="grid three">${[['Empirical','发现真实行为、经验和互动模式'],['Methodological','提出或改进 HCI 研究方法'],['Theoretical','概念框架、机制或理论解释'],['Artifact / System','新型交互产物和系统知识'],['Design','可迁移的设计知识与原则'],['Critical','批判性反思、权力与社会影响']].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div><div class="note">不要机械套用类别；一篇论文可以贡献多种知识，但要识别主贡献。</div>${foot('papers','贡献类型为教学归纳，实际以当年官方分类为准')}`},
{title:'研究方法',note:'介绍定性与定量都可以，方法跟随问题。',html:`<p class="eyebrow">METHODS</p><h2>研究问题决定方法，<br><span class="accent">没有万能模板</span></h2><div class="grid"><div class="card"><h3>理解实践与经验</h3><p>访谈、民族志、观察、日志研究、主题分析</p></div><div class="card"><h3>测量效果与行为</h3><p>对照实验、问卷、行为日志、统计模型</p></div><div class="card"><h3>探索设计空间</h3><p>共设计、参与式设计、Research through Design</p></div><div class="card"><h3>构建与验证交互</h3><p>原型、系统实现、可用性测试、现场部署</p></div></div>${foot('papers')}`},
{title:'论文结构',note:'章节结构为常见写法，不是官方固定目录；这里的 Findings 指研究发现，Funding 指经费披露，两者不是同一章节。',html:`<p class="eyebrow">PAPER ANATOMY</p><h2>一篇 CHI 论文的常见<span class="accent">框架与骨架</span></h2><div class="grid two">${[['01','Introduction · 引言','研究背景 → 为什么研究 → Research Gap → 2–4 个 RQs（常见经验，并非硬性要求）→ Contributions。明确研究对象、研究边界以及论文独特价值。'],['02','Related Work · 相关工作','通常按 3–4 个主题小节组织（经验做法），围绕研究问题梳理已有 HCI 研究、研究张力与尚未解决的问题，并对应后文发现。'],['03','Methods · 研究方法','完整披露样本与招募、数据来源、研究流程、访谈或实验设计、数据分析与编码过程、研究者立场、伦理及研究局限。'],['04','Findings / Results · 研究发现','分主题陈述研究结果，使用访谈原话、观察、实验或其他证据支撑分析；与 RQs 及 Related Work 的主题形成清晰呼应。'],['05','Discussion · 讨论','深入解释 Findings，和已有 HCI/CSCW 论文对话：此前研究已经解释了什么，本研究拓展、修正或挑战了什么，以及对 HCI 领域有何意义。'],['06','Design Implications · 设计启示','从具体发现推导可实行的交互设计建议，说明适用场景、所需信息或系统能力及潜在限制，并衔接已有设计/系统工作。'],['07','Conclusion · 结论','简洁回答研究问题，回扣核心发现与理论、经验或设计贡献；不要提出未经本文证据支持的新结论。'],['08','References · 参考文献','按相关性、质量和研究脉络选择文献。90 篇以上、约 60% ACM/HCI 来源可作为部分研究团队的经验参照，并非 CHI/CSCW 的数量或比例要求。']].map(x=>`<div class="card"><span class="kicker">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div><div class="note"><b>贯穿全文的写作逻辑：</b>Introduction 提出问题，Related Work 建立学术对话，Methods 说明如何研究，Findings 提供证据，Discussion 推进知识，Design Implications 给出可检验的设计方向。<br><b>术语提醒：</b>Findings（发现）不同于 Funding（经费信息）；Funding 通常根据出版要求在 Funding Statement / Acknowledgments 等位置披露。</div>${foot('papers','结构与引用数量为教学经验，非固定投稿规定')}`},
{title:'论文论证链',note:'用医疗AI例子讲从数据到贡献，不要把设计建议脱离发现。',html:`<p class="eyebrow">ARGUMENT CHAIN</p><h2>如何把数据写成 <span class="accent">Contribution</span>？</h2><div class="funnel"><div class="node">现象<br><span class="mini">患者使用医疗 AI</span></div><div class="arrow">→</div><div class="node">RQ<br><span class="mini">何时核验与披露？</span></div><div class="arrow">→</div><div class="node">Method<br><span class="mini">访谈 / 分析</span></div></div><div class="funnel"><div class="node">Evidence<br><span class="mini">参与者叙述</span></div><div class="arrow">→</div><div class="node">Findings<br><span class="mini">策略与情境</span></div><div class="arrow">→</div><div class="node">Discussion<br><span class="mini">理论与设计贡献</span></div></div><div class="note">每个结论都问一次：证据是什么？它和已有研究有何区别？有什么可推广的解释价值？</div>${foot('papers','教学案例，不对应一篇既定论文')}`},
{title:'写作常见坑',note:'可让学生指出哪个问题他们最容易遇到。',html:`<p class="eyebrow">WRITING PITFALLS</p><h2>论文写作中容易遇到的 <span class="accent">6 个问题</span></h2><div class="grid three">${[['背景很长','没有明确定义研究缺口'],['文献罗列','缺少主题综合和批判性对话'],['Methods 太短','招募、程序、分析不透明'],['结果 = 引言','缺少研究者的分析与解释'],['Discussion 重复结果','没有说明理论与 HCI 贡献'],['建议脱离证据','凭空提出功能或设计原则']].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div>${foot('papers','教学建议')}`},
{title:'写作工具',note:'演示 Overleaf 和 Zotero 的协作：Zotero 管理文献与 BibTeX，Overleaf 管理 LaTeX 稿件。',html:`<p class="eyebrow">WRITING WORKFLOW</p><h2>如何写作：<span class="accent">Overleaf + Zotero</span></h2><div class="twoCol"><div class="card soft"><h3>Overleaf · 在线 LaTeX 协作编辑器</h3><p>用于 ACM 模板、章节组织、表格与图片、交叉引用、编译 PDF 和合作者实时编辑。</p><pre>CHI_Paper/
├─ main.tex
├─ references.bib
├─ sections/
│  ├─ introduction.tex
│  ├─ related_work.tex
│  ├─ methods.tex
│  ├─ findings.tex
│  └─ discussion.tex
└─ figures/</pre><a class="doc-action" href="https://www.overleaf.com/project" target="_blank" rel="noopener">打开 Overleaf ↗</a></div><div class="card"><h3>Zotero · 文献与引用管理工具</h3><p>收集和整理 CHI、CSCW、DIS、期刊等文献；记录 DOI、关键词和笔记；导出 BibTeX / Better BibTeX，与 Overleaf 中的 references.bib 衔接。</p><ul class="bullets"><li><b>检索：</b>按研究主题和 Related Work 小节整理</li><li><b>管理：</b>核对作者、标题、年份、会议及 DOI</li><li><b>引用：</b>保持 citation key 稳定、统一格式</li><li><b>协作：</b>共享文献库与论文草稿</li></ul><a class="doc-action" href="https://www.zotero.org/" target="_blank" rel="noopener">打开 Zotero ↗</a></div></div><div class="note"><b>文献选择经验：</b>结合近期和经典的高相关 HCI 研究，例如医疗 AI 论文应优先检索医疗信息寻求、医患交互、医疗 AI 与健康技术方向的 CHI/CSCW/DIS 等研究；正式 Full Papers、经典高影响工作和直接相关的跨学科研究均可使用。不要追求不相关的“凑引用数量”。<br>Overleaf 和 Zotero 是常用工具，并非投稿方强制指定的软件。</div>${foot('template','写作工具与引用经验')}`},
{title:'LaTeX 模板',note:'代码只是最小示意，真实投递从官网模板开始。',html:`<p class="eyebrow">LIVE CODING</p><h2>ACM 单栏评审模板</h2><div class="twoCol"><pre>\\documentclass[manuscript,screen,review,anonymous]{acmart}
\\begin{document}
\\title{Your CHI Paper Title}
\\begin{abstract}
Your abstract...
\\end{abstract}
\\maketitle
\\section{Introduction}
\\section{Related Work}
\\section{Methods}
\\section{Findings}
\\section{Discussion}
\\section{Conclusion}
\\bibliography{references}
\\end{document}</pre><div class="card"><h3>投稿前请核查</h3><p>单栏匿名稿；引用文件；图片可读性；匿名附件；当年页面要求的元数据。</p><div class="note warn">这是教学用精简代码。完整投稿应使用当年官方 ACM 模板并保留必需命令。</div></div></div>${foot('template')}`},
{title:'参考文献',note:'直接反驳禁止引用中文C刊和必须引用一定数量CHI的传言。',html:`<p class="eyebrow">RELATED WORK & REFERENCES</p><h2>必须引用 CHI？不能引用中文 C 刊？</h2><div class="grid"><div class="card"><h3>✕ 没有“CHI 引用配额”</h3><p>官方没有规定 CHI 文献必须占多少比例，也不要求每篇论文引用其他 CHI 论文。</p></div><div class="card"><h3>✕ 没有“禁止中文文献”</h3><p>可引用相关的 CSSCI 等非英文资料；提供准确书目信息和合适的语言说明。</p></div><div class="card soft"><h3>✓ 必须和 HCI 文献对话</h3><p>忽略相关 HCI 研究背景可能造成 Desk Reject。</p></div><div class="card soft"><h3>✓ 质量高于数量</h3><p>从问题出发组织研究脉络，确保每条引用真实、相关、可核验。</p></div></div>${foot('review')}`},
{title:'投稿时间线',note:'所有截止时间AoE；2027 paper投稿在2026年9月已截止。',html:`<p class="eyebrow">OFFICIAL TIMELINE</p><h2>CHI 2027 Full Paper 时间线</h2><div class="grid"><div class="timeline">${[['08/13','PCS 开放'],['09/10','完整论文截止（无独立摘要截止）'],['约 10/26','初筛 / ADR 通知'],['11/05','第一轮评审意见'],['12/03','Revision 截止']].map(r=>`<div class="date">2026 ${r[0]}</div><div>${r[1]}</div>`).join('')}</div><div class="timeline">${[['12/17','最终通知'],['01/07','E-rights'],['01/14','TAPS 上传'],['02/18','Publication-ready'],['03/04','注册 + 报告视频截止']].map((r,i)=>`<div class="date">${i===0?'2026':'2027'} ${r[0]}</div><div>${r[1]}</div>`).join('')}</div></div><div class="note">日期均为 AoE（Anywhere on Earth）。当前基准时间为 2026 年 10 月 31 日。</div>${foot('papers')}`},
{title:'四个责任名额',note:'必须重点讲“作者审稿”不是“给自己找四个评审”；可以豁免，须满足资格。',html:`<p class="eyebrow">NEW IN CHI 2027</p><h2>一篇投稿 = <span class="accent">4 个审稿责任名额</span></h2><div class="grid three"><div class="card soft"><div class="number">1+1+1+1</div><p>四名合格作者各承担 1 篇</p></div><div class="card soft"><div class="number">2+2</div><p>两名合格作者各承担 2 篇</p></div><div class="card soft"><div class="number">4</div><p>一名合格作者承担 4 篇</p></div></div><div class="note">这是作者团队为会议审查<b>其他论文</b>所承担的责任。不能指定非作者；若没有合格审稿作者，可依政策申请豁免。</div>${foot('policy')}`},
{title:'评审体系',note:'2027新版：三位外审+一位AC，SC监督。旧CHI有1AC/2AC，讲清年份变化。',html:`<p class="eyebrow">WHO REVIEWS?</p><h2>R1、R2、R3 与 AC、SC 的区别</h2><div class="funnel"><div class="node">R1<br><span class="mini">外审 1</span></div><div class="node">R2<br><span class="mini">外审 2</span></div><div class="node">R3<br><span class="mini">外审 3</span></div><div class="arrow">→</div><div class="node" style="background:#d9ece0">AC<br><span class="mini">组织讨论 + Meta-review</span></div></div><div class="grid"><div class="card"><h3>AC · Associate Chair</h3><p>分配评审、协调争议、综合三份意见、提出决策建议。</p></div><div class="card"><h3>SC · Subcommunity Chair</h3><p>监督一组 AC 的质量、一致性与公平性；参与重大决定。</p></div></div><div class="note warn">R1/R2/R3 是编号，不是资历等级；CHI 2027 已调整旧式 1AC / 2AC 结构。</div>${foot('process')}`},
{title:'评审五项标准',note:'Clarity是表达；Novelty和Originality区分但不是机械打分。',html:`<p class="eyebrow">EVALUATION RUBRIC</p><h2>审稿人判断的 <span class="accent">5 个维度</span></h2><div class="grid three">${[['Originality','有什么原创想法或方法？'],['Correctness','方法、数据、论证够严谨吗？'],['Novelty','与已有文献相比新增什么？'],['Importance','对 HCI 为什么重要？'],['Clarity','问题、证据、结论是否清晰？']].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div><div class="note">不同方法有不同的严谨性标准。定性论文并不需要硬套实验研究的评审方法。</div>${foot('review')}`},
{title:'评分解释',note:'五个字母都是审稿建议，不是AC最终通知。',html:`<p class="eyebrow">REVIEW RATINGS</p><h2>A / ARR / RR / RRX / X</h2><table class="table"><thead><tr><th>代码</th><th>完整名称</th><th>中文理解</th></tr></thead><tbody>${[['A','Accept with Minor Revisions','支持小修'],['ARR','Accept or Revise and Resubmit','小修或实质修改均可'],['RR','Revise and Resubmit','建议大修后重评'],['RRX','Revise and Resubmit or Reject','大修与拒稿之间'],['X','Reject','建议拒稿']].map(r=>`<tr><td><span class="chip">${r[0]}</span></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table><div class="note">评分是推荐，不是简单投票。正式第一轮结果为 Minor Revisions、Major Revisions 或 Reject。</div>${foot('review')}`},
{title:'拒稿模拟互动',note:'点选后让学生讨论：为什么不是数Reject票数？仅提供官方明确的常见路径和谨慎解读。',html:`<p class="eyebrow">CLASSROOM EXERCISE</p><h2>有一个 X，就一定拒稿吗？</h2><p class="subtitle">试着改变三位外审的建议，理解可能出现的结果。</p><div class="poll" id="vote"></div><div class="poll-result" id="voteResult"></div><div class="note warn">没有“一票否决”或“两个 X 必拒”的机械规则。AC 会结合论文问题及修改可行性作出判断。</div>${foot('review')}`},
{title:'2027 新筛选',note:'注意50-60%是计划目标，不是录取率；AI辅助不替代人工决策。',html:`<p class="eyebrow">STAGED REVIEW</p><h2>2027 年新增的重要筛选阶段</h2><div class="funnel"><div class="node">Submission</div><div class="arrow">→</div><div class="node">Desk Reject<br><span class="mini">格式/匿名/完整性</span></div><div class="arrow">→</div><div class="node">ADR<br><span class="mini">实质学术筛选</span></div><div class="arrow">→</div><div class="node">Full Review</div></div><div class="grid"><div class="card"><div class="number">50–60%</div><p>官方工作目标：进入完整外部评审的稿件比例（不是录取率）</p></div><div class="card"><h3>AI 辅助，人负责决定</h3><p>可用于完整性、匹配和初筛评估；AC、SC、Papers Chairs 最终负责。</p></div></div>${foot('process')}`},
{title:'修稿与回应',note:'讲回应审稿不是逐字争吵，是具体变更证据。',html:`<p class="eyebrow">REVISION</p><h2>收到意见以后怎么做？</h2><div class="grid three">${[['01','分类意见','方法 / 证据 / 论证 / 表达'],['02','识别关键风险','哪些问题直接影响录取？'],['03','制定修改表','意见 → 修改位置 → 证据'],['04','逐条回应','感谢 + 回应 + 新文本位置'],['05','标记修改','提交匿名修订稿及回应信'],['06','第二轮评审','最终 Accept / Reject']].map(x=>`<div class="card"><span class="kicker">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div><div class="note">CHI 2027 修改期约四周；第二轮没有第三次大修机会。</div>${foot('review')}`},
{title:'Poster vs Paper',note:'Poster和Full Paper不只是字数不同；Poster是Extended Abstract。',html:`<p class="eyebrow">OTHER PATHWAYS</p><h2>Full Paper 与 Poster 有什么不同？</h2><table class="table"><thead><tr><th>维度</th><th>Full Paper</th><th>Poster</th></tr></thead><tbody>${[['成果性质','完整研究贡献','自成一体的阶段成果、原型或见解'],['长度','2027 鼓励 5k–8k words','2027 最多 4 页（不含参考）'],['审稿','Refereed，完整审稿','Reviewed，流程更轻量'],['出版','CHI Proceedings','CHI Extended Abstracts'],['呈现','Talk / 视频','A0 海报 / 远程视频'],['对本科生','可投稿，但证据需成熟','适合探索性研究展示']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table>${foot('poster')}`},
{title:'录取后',note:'注意远程报告仍要注册；视频有字幕。',html:`<p class="eyebrow">AFTER ACCEPTANCE</p><h2>录取后，还有 <span class="accent">一整套工作</span></h2><div class="funnel"><div class="node">版权 E-rights</div><div class="arrow">→</div><div class="node">TAPS 排版</div><div class="arrow">→</div><div class="node">Publication-ready</div><div class="arrow">→</div><div class="node">注册 + 报告</div></div><div class="grid"><div class="card"><h3>线下参加</h3><p>会议注册、英文报告 Slides、现场交流、Poster 打印（如适用）。</p></div><div class="card"><h3>远程展示</h3><p>CHI 2027 允许指定类型的预录报告视频；仍需要按官方要求注册，视频应配字幕。</p></div></div>${foot('papers')}`},
{title:'三种视频',note:'具体格式规格每年更新，分清Video Figure vs Preview vs Presentation。',html:`<p class="eyebrow">VIDEO MATERIALS</p><h2>三类视频，三个不同用途</h2><div class="grid three"><div class="card"><h3>Video Figure</h3><p>投稿附件。展示系统、交互或研究场景；随论文提交，并符合双盲。</p></div><div class="card"><h3>Video Preview</h3><p>可选的简短传播视频。帮助公众快速理解研究贡献。</p></div><div class="card"><h3>Presentation Video</h3><p>论文报告；用于远程展示或按大会要求播放，需满足字幕要求。</p></div></div><div class="note">CHI 2027 Papers 的注册与报告视频截止为 2027/03/04。投稿视频与正式报告视频的规格不能混用。</div>${foot('video')}`},
{title:'费用',note:'注册费不等于APC。会员 APC 500非会员750仅针对需要自行缴纳的情形。2027注册各档价格以官网发布为准。',html:`<p class="eyebrow">BUDGET & FEES</p><h2>投稿要算清楚 <span class="accent">3 类费用</span></h2><div class="grid three"><div class="card"><h3>投稿费</h3><div class="number">—</div><p>Full Paper 官方未列单独投稿费用</p></div><div class="card"><h3>出版 APC</h3><div class="number">$500</div><p>会员需付时；非会员 $750。ACM Open 与豁免另计。</p></div><div class="card"><h3>注册 + 差旅</h3><div class="number">TBD</div><p>学生/普通、会员/非会员、国家类别及机票住宿。</p></div></div><div class="note warn">2027 注册价格需以当年正式价格表为准；不要将 APC 误认为注册费。Poster 的 APC 政策不同。</div>${foot('papers')}`},
{title:'奖项与案例',note:'建议后续用真实PDF替换当前题目卡片，课堂可点开ACM获奖目录。',html:`<p class="eyebrow">READ BEST PAPERS</p><h2>读优秀论文，学习<span class="accent">贡献如何表达</span></h2><div class="grid"><div class="card"><span class="chip">2025 · 创意劳动</span><h3>Creative Writers’ Attitudes on Writing as Training Data for Large Language Models</h3><p>研究创作者对作品用于训练 LLM 的观点。</p></div><div class="card"><span class="chip">2025 · 健康 / 辅助沟通</span><h3>AACessTalk: Fostering Communication between Minimally Verbal Autistic Children and Parents</h3><p>设计与用户研究如何形成可用的设计知识。</p></div><div class="card"><span class="chip">2023 · 社会技术</span><h3>Infrastructuring Care</h3><p>技术如何支持群体的健康与照护实践。</p></div><div class="card soft"><h3>读论文的四个问题</h3><p>RQ 是什么？方法为什么合适？核心发现是什么？与 Related Work 有什么对话？</p></div></div>${foot('awards','精选阅读案例；完整获奖名单请打开来源')}`},
{title:'真实评审案例：四位评审意见',note:'案例来源：用户提供的 CHI 2026 微短剧论文首轮审稿材料。材料中明确写有 1AC、2AC、reviewer 1、reviewer 2；这是旧年度的实际案例，不能直接当成 CHI 2027 的组织结构。',html:`<p class="eyebrow">REAL REVIEW CASE · CHI 2026</p><h2>同一篇论文，评审意见为什么会<span class="accent">不同</span>？</h2><div class="grid"><div class="card"><span class="tag-pink">1AC · Meta-review</span><h3>RR · Revise and Resubmit</h3><p>肯定选题与流程可视化，同时要求澄清贡献、方法和理论对话。</p></div><div class="card"><span class="tag-green">2AC · Secondary AC</span><h3>A / RR 之间</h3><p>认为具有 HCI 贡献、图示清楚，建议进一步整理叙事和结构。</p></div><div class="card"><h3>Reviewer 1：RRX</h3><p>认为原创性与重要性仍有疑问，特别关注和已有创作者研究的差异。</p></div><div class="card"><h3>Reviewer 2：RR</h3><p>认可选题与论文表达，但质疑样本角色、研究问题与分析方法的对应关系。</p></div></div><div class="note">这是上传的真实评审记录，不能以这份材料推断论文最终是否录取；这里的“R1/R2”是案例文件中的评审标签。</div>${foot('review','案例 · CHI 2026 真实评审材料')}`},
{title:'真实评审案例：学术新颖性',note:'讲解Reviewer为何要求证明“比已有研究多发现了什么”。用短原文片段，非全文转录。',html:`<p class="eyebrow">REVIEW EXCERPT · ORIGINALITY</p><h2><span class="tag-pink">Originality</span> 你的发现和已有工作有什么区别？</h2><div class="quote-excerpt">“The contribution is not clearly stated to show novelty.”</div><p class="interpret">— 1AC Meta-review，指出研究需要清晰呈现相对于在线内容创作者研究的新增贡献。</p><div class="grid"><div class="card soft"><h3>审稿人真正关心</h3><p>已有 YouTuber、TikTok 创作者研究了观众反馈；微短剧的叙事生产机制有什么独特性？</p></div><div class="card"><h3>作者可以怎样改</h3><p>在 Introduction 与 Related Work 中形成明确比较；在 Findings 和 Discussion 中证明独特机制及其适用边界。</p></div></div>${foot('review','原文来自已上传的 CHI 2026 评审材料')}`},
{title:'真实评审案例：方法透明性',note:'以Reviewer 2的分析方法提问说明：研究者必须交代访谈编码与内容分析如何结合。',html:`<p class="eyebrow">REVIEW EXCERPT · METHODS</p><h2><span class="tag-green">Research Quality</span> 方法能不能让人理解并核查？</h2><div class="quote-excerpt green">“I am unclear on how the coding of interviews worked alongside the content analysis...”</div><p class="interpret">— Reviewer 2，关注两种分析材料如何发生关联。</p><div class="grid"><div class="card"><h3>方法章节应说明</h3><p>访谈对象为何选这些角色？招募如何进行？访谈编码与视频内容分析分别承担什么功能？</p></div><div class="card soft"><h3>对应修改</h3><p>补充数据来源、分析步骤、代码本形成过程、证据链与研究者立场；明确是否实际开展内容分析。</p></div></div>${foot('review','原文来自已上传的 CHI 2026 评审材料')}`},
{title:'真实评审案例：相关工作',note:'对比媒体传播学与HCI文献：无需限定只引CHI，但是研究的HCI位置要清楚。',html:`<p class="eyebrow">REVIEW EXCERPT · RELATED WORK</p><h2><span class="tag-pink">Related Work</span> 引用相关，并且能与 HCI 对话</h2><div class="quote-excerpt">“There is limited HCI literature (R1, R2).”</div><p class="interpret">— 1AC Meta-review，认为既有引用偏向媒体与传播研究，需要加入与创作者劳动、平台可供性等相关的 HCI 研究。</p><div class="grid"><div class="card"><h3>这里没有要求“只能引用 CHI”</h3><p>跨学科文献是合理的；但应证明论文如何推进 CHI/CSCW 已讨论的问题。</p></div><div class="card soft"><h3>建议引用路径</h3><p>创作者经济 → 平台算法与创意劳动 → 观众参与 → 微短剧特有的生产与叙事机制。</p></div></div>${foot('review','原文来自已上传的 CHI 2026 评审材料')}`},
{title:'真实评审案例：讨论与设计启示',note:'分析为什么“Discussion写得漂亮”还不够：必须从证据出发和已有HCI研究对话。',html:`<p class="eyebrow">REVIEW EXCERPT · DISCUSSION</p><h2><span class="tag-green">Discussion</span> 从发现走向解释与设计意义</h2><div class="quote-excerpt green">“The discussion section lacks depth (R1).”</div><p class="interpret">— 1AC Meta-review，期待作者进一步解释观众反馈循环如何影响创作者自主权与平台设计。</p><div class="grid"><div class="card"><h3>弱的 Discussion</h3><p>重复“创作者会根据评论修改剧情”，然后提出笼统的“平台应优化反馈”。</p></div><div class="card soft"><h3>更强的 Discussion</h3><p>分析反馈对叙事控制权和创作劳动的影响，联系已有 HCI 概念，再提出有证据支持的设计策略。</p></div></div>${foot('review','原文来自已上传的 CHI 2026 评审材料')}`},
{title:'真实评审案例：修改任务清单',note:'这一页可互动，让学生练习读AC的Meta-review：识别关键质疑并把每一项映射到论文章节。',html:`<p class="eyebrow">REVIEW → REVISION PLAN</p><h2>把真实审稿意见转成<span class="accent">可执行修改清单</span></h2><table class="table"><thead><tr><th>维度</th><th>关键问题</th><th>修改位置</th></tr></thead><tbody><tr><td>Originality</td><td>与已有在线创作者研究区别不清</td><td>Intro · RW · Discussion</td></tr><tr><td>Concepts</td><td>微短剧、短视频、编剧与创作者边界不清</td><td>Intro · RW</td></tr><tr><td>Method</td><td>招募逻辑、立场、访谈与分析过程不足</td><td>Methods</td></tr><tr><td>HCI Fit</td><td>和平台可供性、创意劳动研究对话不足</td><td>RW · Discussion</td></tr><tr><td>Design Implications</td><td>设计建议过于笼统</td><td>Discussion</td></tr><tr><td>Presentation</td><td>论证线索、章节结构和文字需要打磨</td><td>Full paper</td></tr></tbody></table>${foot('review','归纳自已上传的 CHI 2026 1AC / 2AC / Reviewer 评审材料')}`},
{title:'课堂总结',note:'总结之后转到讨论。',html:`<p class="eyebrow">KEY TAKEAWAYS</p><h2>把一项研究送到 CHI，<br>最关键的<span class="accent">不是格式</span>。</h2><div class="grid three"><div class="card"><div class="number">01</div><h3>好问题</h3><p>现象背后有重要的 HCI 研究问题</p></div><div class="card"><div class="number">02</div><h3>好证据</h3><p>方法和证据能支撑你的结论</p></div><div class="card"><div class="number">03</div><h3>好贡献</h3><p>明确向 HCI 知识体系增加了什么</p></div></div>${foot('papers')}`},
{title:'讨论',note:'鼓励学生提出自己的研究问题或者在现场尝试Reviewer打分。',html:`<p class="eyebrow">Q&A / CLASS DISCUSSION</p><h1>你的第一个<br><span class="accent">CHI 研究问题</span><br>是什么？</h1><p class="subtitle">从一个真实现象出发，试着说出研究问题、方法和预期贡献。</p><div class="pillrow"><span class="chip">向下滚动浏览</span><span class="chip">点击顶部章节导航</span><span class="chip">打开文档查看原文</span><span class="chip">浏览器全屏演示</span></div>${foot('papers')}`}

// CHI and CSCW are intentionally separate pathways; shared writing resources are retained below.
const trackLanding=()=>`<div class="dual-intro"><p class="eyebrow">TWO PUBLICATION PATHWAYS</p><h2>CHI / CSCW · 两条投稿路径</h2><p class="takeaway">分别了解会议定位、论文结构、评审制度与真实修改案例。两条路径可以按研究贡献和审稿进度先后选择，但同一篇稿件不能在两处同时接受评审。</p><div class="two-track-grid"><a href="#chi-path" class="track-panel"><span>01 / CHI</span><h3>CHI</h3><p>Conference on Human Factors in Computing Systems</p><strong>案例：Audience in the Loop ↗</strong></a><a href="#cscw-path" class="track-panel"><span>02 / CSCW</span><h3>CSCW</h3><p>Computer-Supported Cooperative Work & Social Computing</p><strong>案例：Doctor Is Not the Gold Standard ↗</strong></a></div><p class="tiny-label">“Doctor Is Not the Gold Standard”为用户提供的案例名称；其审稿材料讨论 Ant A-Fu 医疗 AI 研究。案例仅代表已收到的 RR/major revision 意见，不预设最终录取。</p></div>`;
const chiPath=()=>`<div class="review-block" id="chi-path"><p class="eyebrow">TRACK ONE · CHI</p><h2>CHI 投稿：会议论文的完整流程</h2><p class="takeaway">适合多种 HCI 贡献：用户研究、技术系统、交互设计、理论与方法。CHI 2027 Full Paper 于 2026/09/10 截止，11/05 发放评审意见，12/03 修改稿截止，12/17 最终通知。</p><div class="review-cols"><div class="card"><h3>研究案例 · Audience in the Loop</h3><p>研究观众反馈怎样进入中国微短剧创作流程。收到 CHI 2026 的 R&R；1AC 聚焦原创性、研究范围、抽样与编码、HCI 文献、Discussion 和设计启示。</p><a class="doc-action" href="https://tiankehe.github.io/audience-in-the-loop/" target="_blank" rel="noopener">查看研究网站、视频与论文 ↗</a></div><div class="card"><h3>主要步骤</h3><p>确定 HCI 贡献 → ACM 模板写作与匿名投稿 → Desk Reject / ADR → 外审、AC Meta-review → Minor / Major Revision 或 Reject → 决定与出版。</p><a class="doc-action" href="https://chi2027.acm.org/authors/papers/" target="_blank" rel="noopener">CHI 2027 官方投稿指南 ↗</a></div></div></div>`;
const cscwPath=()=>`<div class="review-block" id="cscw-path"><p class="eyebrow">TRACK TWO · CSCW / PACM HCI</p><h2>CSCW 投稿：期刊式评审与修改</h2><p class="takeaway">CSCW 的正式研究论文经 PACM HCI 期刊式评审与发表，重点涉及协作、协调、工作实践、社会技术体系及社会计算。与 CHI 的集中会议评审周期不同，CSCW 允许在同一评审流程内更充分的修改与复审。具体时间以对应年度和轮次的 CFP 为准。</p><div class="review-cols"><div class="card"><h3>研究案例 · Doctor Is Not the Gold Standard</h3><p>以 Ant A-Fu 医疗 AI 为案例，讨论患者如何核验 AI 信息、与医生沟通并采取后续行动。AE 和三位 Reviewer 均要求 Major Revision，重点是概念主线、分组证据、研究方法、伦理与理论讨论。</p></div><div class="card"><h3>收到 Major Revision 代表什么？</h3><p>编辑认为研究值得继续修改，要求逐项回应并接受复审；它不是正式录取，也不是最终拒稿。若仍在有效修改期，应先在当前流程完成修订或正式撤稿，再考虑改投 CHI。</p><a class="doc-action" href="https://cscw.acm.org/2026/blog/reviewprocess.html" target="_blank" rel="noopener">CSCW 官方评审机制 ↗</a></div></div></div>`;
const submissionStrategy=()=>`<div class="review-block"><p class="eyebrow">PUBLICATION STRATEGY</p><h2>先投 CSCW，再根据决定调整 CHI 投稿</h2><p class="takeaway">这是<strong>可选择的连续投稿策略</strong>，并非 CSCW → CHI 的自动转投机制。需要根据研究重点、截止时间、稿件状态和 ACM 重复投稿规则判断。</p><div class="route-steps"><div class="route-node"><b>① CSCW 投稿</b><span>提交符合其范围的稿件，等待 AE / Reviewer 决定</span></div><div class="route-split"><div><b>Major Revision / R&R</b><p>还在 CSCW 审稿中：按要求修改并复审；如决定放弃，须按程序正式撤稿。</p></div><div><b>正式 Reject</b><p>该轮评审结束：提炼意见、完成实质修改，才考虑投 CHI 或下一轮 CSCW。</p></div><div><b>Accept</b><p>完成 PACM HCI 出版；相同研究成果不可作为全新 CHI Full Paper 重复发表。</p></div></div><div class="route-node"><b>② 检查 CHI 适配与截稿日期</b><span>强化清晰的 HCI Contribution；比较 CHI 所需篇幅、匿名、格式和审稿机制</span></div><div class="route-node"><b>③ 若再次拒稿</b><span>合并两轮反馈 → 核心研究问题/方法/证据/理论重构 → 补数据（如必要）→ 下一年重新投稿</span></div></div><p class="tiny-label"><b>关键边界：</b>同一实质性工作不得同时在 CSCW 与 CHI 接受评审；存在紧密相关的其他在审稿件时须按当年规定披露。普通改标题、换模板或缩减篇幅，并不足以构成新的研究贡献。</p><div class="resource-grid"><a class="resource-item" href="https://chi2027.acm.org/Authors/Papers/" target="_blank" rel="noopener"><strong>CHI 投稿与并行投稿规则</strong><span>当年官方要求</span>↗</a><a class="resource-item" href="https://cscw.acm.org/2026/blog/reviewprocess.html" target="_blank" rel="noopener"><strong>CSCW 官方复审与转投 FAQ</strong><span>明确提及正式 Reject 后可投 CHI 等其他 venues</span>↗</a></div></div>`;

function ratePanel(){const data=chiRates;const W=950,H=270,left=45,top=25,bottom=217,step=165;const pts=data.map((d,i)=>[left+i*step,top+(36-d.r)/16*(bottom-top)]);return `<div class="research-panel"><p class="eyebrow">ANNUAL ACCEPTANCE</p><h2>CHI 历年录取率 · 2021–2026</h2><p>近年来 CHI Full Paper 录取率整体维持在约 25%；与此同时，投稿规模显著增长。鼠标悬停数据点可查看具体投稿量。</p><svg class="research-rate-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="CHI 历年录取率折线图">${[20,25,30,35].map(v=>`<line x1="45" y1="${top+(36-v)/16*(bottom-top)}" x2="900" y2="${top+(36-v)/16*(bottom-top)}" stroke="#e5e9e5"/><text x="6" y="${top+(36-v)/16*(bottom-top)+4}" font-size="13" fill="#68766b">${v}%</text>`).join('')}<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#7949a2" stroke-width="4" stroke-linejoin="round"/>${pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="7" fill="#7949a2"><title>${data[i].y}: ${data[i].r}% · ${data[i].a} / ${data[i].n}</title></circle><text x="${x}" y="${y-16}" text-anchor="middle" fill="#573073" font-size="15" font-weight="bold">${data[i].r}%</text><text x="${x}" y="252" text-anchor="middle" fill="#4d5852" font-size="14">${data[i].y}</text>`).join('')}</svg><div class="research-legend"><span>2022：2,579 篇投稿</span><span>2026：6,730 篇投稿</span><span>2027 尚未公布最终录取率</span></div><p class="smallsource">数据来源：ACM SIGCHI 会议历史档案与 CHI 2024、2025、2026 Papers 官方统计。不同年份可能存在“完成投稿 / 剔除撤稿”的口径差异。 <a href="https://chi2026.acm.org/2026/02/06/insights-into-the-papers-track-post-pc-meeting-outcomes/" target="_blank">2026 官方报告 ↗</a> · <a href="https://chi2024.acm.org/2024/01/29/chi-2024-papers-track-post-pc-outcomes-report/" target="_blank">2024 官方报告 ↗</a></p></div>`}

function activateAwards(){const node=document.getElementById('award-filters');if(!node)return;let cat='全部',year='全部年份';const filters=['全部','空间与环境','数字媒体','交互设计'];const years=['全部年份','2023','2024','2025','2026'];function render(){node.innerHTML=[...filters.map(x=>`<button class="${cat===x?'active':''}" data-cat="${x}">${x}</button>`),...years.map(y=>`<button class="${year===y?'active':''}" data-year="${y}">${y}</button>`)].join('');const items=researchAwards.filter(x=>(cat==='全部'||x.cat===cat)&&(year==='全部年份'||String(x.year)===year));document.getElementById('award-count').textContent=`显示 ${items.length} 篇 · 代表性精选`;document.getElementById('award-list').innerHTML=items.map(x=>`<div class="research-item"><div class="research-legend"><span>${x.track} ${x.year}</span><span>${x.cat}</span><span>${x.award}</span></div><h3>${x.title}</h3><p>${x.why}</p><a href="${x.url}" target="_blank" rel="noopener">查看该年官方奖项 ↗</a></div>`).join('');node.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});node.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>{year=b.dataset.year;render()});}render();}

function comparisonPanel(){return `<div class="review-block"><p class="eyebrow">COMPARE BEFORE SUBMITTING</p><h2>CHI 与 CSCW：研究定位及投稿方式</h2><div class="review-cols"><div class="card chi-example"><h3>CHI · 人机交互</h3><p>计算技术与人的交互：交互设计、AI、数字媒体、XR、用户研究、可访问性、计算系统与理论方法。会议论文集中评审，2027 设定固定的修改周期。</p><a class="doc-action" href="https://chi2027.acm.org/authors/papers/" target="_blank">官方投稿要求 ↗</a></div><div class="card cscw-example"><h3>CSCW · 计算机支持的协作工作</h3><p>协作、工作实践、协调、社会计算、组织制度与社会技术关系。正式研究论文采用 PACM HCI 期刊式同行评审和复审。</p><a class="doc-action" href="https://cscw.acm.org/" target="_blank">CSCW 官网 ↗</a></div></div><p class="tiny-label">研究领域有交集。选择以研究问题、预期贡献和当年征稿细则为准；拒稿后可修订后顺序转投，不能同时向两处提交实质相同的在审稿件。</p></div>`}
function narrativePanel(){return `<div class="review-block story"><p class="eyebrow">THE CENTRAL IDEA</p><h2>写好 HCI 论文的两件事：<em>卡住标签</em>，<em>讲好故事</em></h2><div class="review-cols"><div class="card"><h3>01 · 卡住研究标签</h3><p>能用一句话明确研究对象、核心现象、关键概念、研究方法和 HCI/CSCW 贡献。重要术语在 Abstract、Introduction、RQs、Findings 和 Discussion 中保持一致，并说清与前人工作的区别。</p></div><div class="card"><h3>02 · 讲好证据故事</h3><p>现实问题 → 已有研究留下的缺口 → 为什么这样研究 → 数据支持了哪些发现 → 哪些概念得到推进 → 能转化成什么设计机会。每一章都承担其中一个环节。</p></div></div><div class="story-chain"><span>Phenomenon</span><b>→</b><span>Gap</span><b>→</b><span>Method</span><b>→</b><span>Evidence</span><b>→</b><span>Contribution</span><b>→</b><span>Implications</span></div><p class="tiny-label">这是从两份真实 RR 的共性提炼出的写作框架，不是官方强制的论文目录。</p></div>`}
function reviewGuide(){return `<div class="review-block"><p class="eyebrow">HOW TO READ THE REVIEW</p><h2>审稿意见是在检查哪一段论证？</h2><div class="review-cols"><div class="card"><h3>研究的定位</h3><p>是不是 HCI/CSCW 问题？创新与已有研究的边界何在？主要概念是否有稳定定义？</p><p class="quiet-quote">“The contribution is not clearly stated to show novelty.”</p><p class="tiny-label">Audience in the Loop · 1AC</p></div><div class="card"><h3>方法和证据</h3><p>谁参与、为什么选他们、怎样采集和分析数据？不同群体能否合并解释？主张是否超出证据？</p><p class="quiet-quote">“The sampling strategy and terminology require clearer qualification.”</p><p class="tiny-label">Ant A-Fu · Reviewer 1</p></div><div class="card"><h3>理论与讨论</h3><p>Findings 是否只有现象描述？Discussion 是否只是重复发现？与已有理论有什么延伸、挑战或限定？</p><p class="quiet-quote">“The Discussion needs stronger conceptual synthesis and theoretical development.”</p><p class="tiny-label">Ant A-Fu · Reviewer 1</p></div><div class="card"><h3>设计启示与可行动性</h3><p>设计建议是否来自实际发现、具备技术和交互机制，并能解释如何评估？</p><p class="quiet-quote">“more thoughtful rather than generic HCI design implications.”</p><p class="tiny-label">Audience in the Loop · 1AC（原句片段）</p></div></div></div>`}

ardPanel()+outreachView()+slides.slice(27,33).map((x,j)=>`<article class="slide" id="topic-${j+27}">${x.html}</article>`).join(''):''}${part.key==='cscw'?`<div class="section-break-chi section-break-cscw"><span>PART II / CSCW</span><h2>CSCW 投稿</h2><p>研究定位 · 期刊式评审 · 修改与再投稿</p></div>`+cscwPath()+submissionStrategy():''}${part.key==='reviews'?narrativePanel()+reviewGuide()+readReviews()+`<div class="section-break-chi section-break-review"><span>PART III / PEER REVIEW</span><h2>如何撰写审稿意见</h2><p>官方评审标准 · 研究贡献 · 方法与证据 · 真实审稿视角</p></div>`+reviewerView():''}${part.key==='resources'?allResources():''}</div></section>`).join('');

 let currentIndex=0;

<div class="review-block"><p class="eyebrow">READING A REVIEW</p><h2>收到 RR 之后，评审到底在说什么？</h2><p class="takeaway">来自两篇真实论文的评审：<b>Audience in the Loop</b>（CHI 2026）与 <b>Ant A-Fu 患者端医疗 AI 研究</b>（PACM HCI / CSCW Major Revision）。这里分析的是收到的修改建议，<b>不代表两篇论文的最终录取结果</b>。</p>
<div class="review-cols"><div class="card chi-example"><span class="chip">CHI · Audience in the Loop</span><p>1AC 重点：新颖性、研究对象边界、方法透明、HCI 文献、Discussion 与设计启示。</p></div><div class="card cscw-example"><span class="chip">CSCW · Ant A-Fu</span><p>AE 重点：整篇概念主线、患者与医疗人员的角色区分、主题分析、理论综合、伦理和设计启示。</p></div></div></div>
<div class="review-block"><p class="eyebrow">CHAPTER BY CHAPTER</p><h2>两篇 RR 按论文章节对照</h2><table class="review-table"><thead><tr><th>章节</th><th>Audience in the Loop · CHI</th><th>Ant A-Fu · CSCW</th></tr></thead><tbody>
<tr><td>Introduction</td><td>研究究竟解释“行业”还是“编剧实践”？微短剧区别于 YouTube/TikTok 的新贡献是什么？</td><td>围绕具体应用提出的 RQ 太窄；需要在前面建立更广泛的社会技术问题及概念主线。</td></tr>
<tr><td>Related Work</td><td>媒体传播学文献较多；要与 HCI 的创作者经济、平台可供性和创意劳动形成实质性对话。</td><td>文献覆盖面广但偏描述；要梳理冲突、局限和未解决的概念问题，并界定 epistemic authority。</td></tr>

</tbody></table><p class="reviewer-source">均为根据上传的真实评审记录归纳的中文解释；以下为两篇评审材料的归纳示例。</p></div>
<div class="review-block"><p class="eyebrow">WHAT DOES IT REALLY MEAN?</p><h2>评审语句背后的真实问题</h2>
<div class="review-cols"><div><h3>“Contribution is unclear”</h3><div class="quiet-quote">“The contribution is not clearly stated to show novelty.”</div><p class="takeaway"><b>真正意思：</b>作者必须指出相较于现有创作者研究，这个研究新增加了哪一层理解。只改写贡献句并不够，Findings 和 Discussion 要提供相应证据。</p><p class="reviewer-source">Audience in the Loop · 1AC Meta-review</p></div><div><h3>“Conceptual spine is missing”</h3><div class="quiet-quote">“Lack of a coherent conceptual spine.”</div><p class="takeaway"><b>真正意思：</b>多个主题需要共同解释一个明确的研究现象，并从 Introduction 一直贯穿到 Discussion；重排章节只是其中一步。</p><p class="reviewer-source">Ant A-Fu · Reviewer 1</p></div>

<div class="review-block"><h2>一套适用于写作阶段的 7 项自查</h2><div class="grid"><div class="card"><h3>01 · Scope</h3><p>研究对象、场景和解释的现象是否一致？</p></div><div class="card"><h3>02 · Novelty</h3><p>相对既有研究真正增加了什么？</p></div><div class="card"><h3>03 · Method</h3><p>抽样、程序、编码、伦理和局限能否被理解？</p></div><div class="card"><h3>04 · Evidence</h3><p>所有重要主张能否找到具体证据？</p></div><div class="card"><h3>05 · Concepts</h3><p>核心术语是否定义，概念关系是否建立？</p></div><div class="card"><h3>06 · Discussion</h3><p>是否解释、拓展或挑战了已有 HCI 认识？</p></div><div class="card"><h3>07 · Design</h3><p>设计建议是否具体可做、并由发现支撑？</p></div></div></div>
`}
function reviewerView(){return `
<div class="review-block"><p class="eyebrow">REVIEWER'S PERSPECTIVE</p><h2>如果我自己做 Reviewer，会从哪些角度看论文？</h2><p class="takeaway">CHI 2027 官方评审标准为五个维度。审稿人需要先准确概括作者希望作出的贡献，再判断方法与论证是否足以支撑它。评分也不能简单等同于“自己喜不喜欢这个主题”。</p><div class="rubric-grid"><div><b>Originality</b>产生了哪些新想法、方法或视角？</div><div><b>Correctness</b>研究流程、方法与证据是否严谨？</div><div><b>Novelty</b>与现有 HCI 研究相比增加了什么？</div><div><b>Importance</b>贡献为何重要，适用于谁？</div><div><b>Clarity</b>概念、图表和论证是否清楚？</div></div><a class="doc-action" href="https://chi2027.acm.org/guide-to-reviewing-papers/" target="_blank" rel="noopener">CHI 2027 官方 Reviewer Guide ↗</a><a class="doc-action" href="https://chi2027.acm.org/authors/papers/papers-review-process/" target="_blank" rel="noopener">官方流程与推荐等级 ↗</a></div>
<div class="review-block"><h2>案例 A：文化遗产导览中的对话与好奇心</h2><p class="takeaway"><b>Conversation Strategies for Supporting Curiosity in Heritage</b>。以下取自你提供的个人审稿笔记，为初步评审观察，并非已经定稿的正式 Review 或会议决定。</p><table class="review-table"><thead><tr><th>笔记焦点</th><th>它在问什么？</th><th>审稿人应该怎样具体化？</th></tr></thead><tbody><tr><td>HCI Fit</td><td>研究只讲人与人如何交谈，技术交互贡献在哪里？</td><td>要求指出发现如何转化为 HCI 的设计知识、系统机制或可评估的问题。</td></tr><tr><td>Concept</td><td>Curiosity 如何定义？</td><td>要求明确理论定义、分析指标，以及与访谈/观察编码的关系。</td></tr><tr><td>Claims</td><td>结论是否过度外推？</td><td>指出哪一项结论超出了参与者、场景或数据的支持。</td></tr><tr><td>Methods</td><td>研究流程是否足够透明？</td><td>关注招募、导览情境、数据分析与研究者角色。</td></tr><tr><td>Design</td><td>有没有超越 Future Work 的设计启示？</td><td>要求提出具体交互策略、应用场景和证据来源；并非所有经验研究都必须实现系统。</td></tr></tbody></table></div>
<div class="review-block"><h2>案例 B：生成式 AI 与新闻生产</h2><p class="takeaway"><b>Whose News? How Generative AI Affects Journalistic Products and How the Effect Is Perceived by Journalists</b>。这组笔记最集中的问题是因果识别、实验控制、数据效度和质性分析透明度。</p><table class="review-table"><thead><tr><th>笔记焦点</th><th>潜在缺陷</th><th>可操作的审稿问题</th></tr></thead><tbody>
<tr><td>Research Design</td><td>不同人使用 AI 的频率和方式不一致</td><td>如何区分 AI 的影响与个体差异、任务差异？是否有对照或控制？</td></tr>
<tr><td>Sampling</td><td>为何包含教师？参与者之间是否认识？</td><td>这些样本如何代表目标实践？关系是否可能影响评价？</td></tr>
<tr><td>Data Validity</td><td>学生生成的材料可能有偏差</td><td>数据集如何形成、验证、抽样？新闻质量的基准是什么？</td></tr>
<tr><td>Evaluation</td><td>同一主体写作又自评</td><td>评价者是否独立？是否盲评？如何处理自我评价偏差？</td></tr>
<tr><td>Analysis</td><td>编码和主题分析流程未交代</td><td>谁编码、怎样生成主题、分歧如何处理、使用什么分析取向？</td></tr>
<tr><td>Claims</td><td>长期影响可能仅基于主观感受</td><td>论文测到的是 perceived impact 还是长期行为变化？如何准确表述？</td></tr>
<tr><td>Design</td><td>缺少具体的 HCI 启示</td><td>哪些实际的新闻工作流/界面设计方案由研究结果支持？</td></tr></tbody></table><p class="reviewer-source">这里将“GenAI should not be used by people wanting to get at truth”归为需要证据支撑的个人判断，不作为客观审稿标准。</p></div>
<div class="review-block"><p class="eyebrow">HOW TO WRITE A CONSTRUCTIVE REVIEW</p><h2>把碎片化笔记写成专业审稿意见</h2><div class="review-cols"><div class="card"><h3>原始笔记</h3><div class="quiet-quote">“no rigor at all”</div><p>过于笼统，难以指导作者修改。</p></div><div class="card"><h3>更有帮助的表达（教学拟写）</h3><p>“The current study design makes it difficult to attribute the observed differences to AI assistance, as participants varied substantially in their usage patterns and task conditions. I encourage the authors to clarify these factors and qualify the causal claims.”</p><p class="reviewer-source">这是由笔记改写的教学示例，非原审稿意见。</p></div></div>
<div class="review-cols" style="margin-top:16px"><div class="card"><h3>原始笔记</h3><div class="quiet-quote">“not clear how curiosity is defined”</div></div><div class="card"><h3>更有帮助的表达（教学拟写）</h3><p>“Curiosity is central to the framing, but its definition and role in the analysis remain unclear. Please explain how the concept informed data collection, coding, and the design implications.”</p></div></div></div>
<div class="review-block"><h2>一份高质量 Review 的基本骨架</h2><div class="grid"><div class="card"><h3>01 · Summary</h3><p>准确概括研究问题、方法、贡献主张。</p></div><div class="card"><h3>02 · Strengths</h3><p>具体指出哪些贡献、数据或研究设计具有价值。</p></div><div class="card"><h3>03 · Major Concerns</h3><p>围绕创新、严谨、证据和意义，说明问题为什么重要。</p></div><div class="card"><h3>04 · Actionable Revisions</h3><p>提出作者能回应的具体问题，区别必要修正和扩展性建议。</p></div></div><p class="takeaway">CHI 2027 官方建议一份高质量评审通常约 650 词。审稿人还应遵循利益冲突、保密与 AI 使用规定；对不同学术方法采用适合该领域的严谨性标准。</p></div>`}

function renderPoll(){const vote=document.getElementById('vote');if(!vote)return;vote.innerHTML=score.map((x,i)=>`<label style="display:flex;flex-direction:column;gap:7px;font-weight:700">R${i+1}<select style="padding:10px 14px;border-radius:7px;border:1px solid #aaa;font-size:15px" onchange="score[${i}]=this.value;renderPoll()">${['A','ARR','RR','RRX','X'].map(a=>`<option ${x===a?'selected':''}>${a}</option>`).join('')}</select></label>`).join('');const k=score.filter(x=>['A','ARR'].includes(x)).length;const r=document.getElementById('voteResult');if(r)r.textContent=k===3?'三份都是 A / ARR：通常满足 Minor Revisions 的推荐门槛。':k===2?'两份达到 A / ARR：可能进入 Major Revisions；具体仍由 AC 综合判断。':'不足两份 A / ARR：不能据此计算最终拒稿概率，实际取决于评审讨论。'}
build();
